# Builds Terminactory for the Asciiverse catalog: one archive per target,
# named <id>-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
#
# Tags look like v0.1.0+20261115-av.1: upstream's version and the date of
# the upstream commit, then our release. Built without the default
# agent-mail feature (no `tfac msg`, no Claude Code hook, no inbox; see
# PATCHES.md). Linux builds run in Alpine, so the binaries are static
# (musl). Pure Rust (Ratatui, crossterm); the wiki and the in-game web are
# built into the binary. Each archive holds both commands, `terminactory`
# and its shortcut `tfac`.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: terminactory
  TAG: ${{ inputs.tag || github.ref_name }}
  FEATURES: --no-default-features

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -c "
            apk add --no-cache musl-dev &&
            cargo build --release --locked $FEATURES &&
            strip target/release/terminactory target/release/tfac"
          sudo chown -R "$(id -u):$(id -g)" target
          file target/release/terminactory target/release/tfac

      - name: Package for av
        run: |
          # the binaries sit at the top of the archive, where av looks for them
          mkdir -p stage dist
          cp target/release/terminactory target/release/tfac stage/
          cp asciiverse/README.md LICENSE CHANGELOG.md PATCHES.md stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
          cargo build --release --locked $FEATURES --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/terminactory target/${{ matrix.target }}/release/tfac
          file target/${{ matrix.target }}/release/terminactory

      - name: Package
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/terminactory target/${{ matrix.target }}/release/tfac stage/
          cp asciiverse/README.md LICENSE CHANGELOG.md PATCHES.md stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        shell: bash
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
          cargo build --release --locked $FEATURES --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/terminactory.exe target/${{ matrix.target }}/release/tfac.exe stage/
          cp asciiverse/README.md LICENSE CHANGELOG.md PATCHES.md stage/
          (cd stage && 7z a -tzip "../dist/$ID-${{ matrix.target }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Terminactory $TAG" \
                 --notes "Terminactory by snipedbywifi (gitlab.com/snipedbywifi/terminactory), built for the Asciiverse catalog: one binary for Linux, macOS and Windows. Apache-2.0. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber

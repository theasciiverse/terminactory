[package]
name = "terminactory"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A cozy factory game in the terminal, played next to your AI agents"
license = "Apache-2.0"
repository = "https://gitlab.com/snipedbywifi/terminactory"
readme = "README.md"
keywords = ["game", "terminal", "factory", "tui", "ratatui"]
categories = ["games"]
default-run = "terminactory"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3
